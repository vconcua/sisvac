# ============================================================
# SISVAC — Levanta todo el sistema con un solo comando:
#   docker compose up --build
#
# Servicios:
#   - db        PostgreSQL 16, con schema.sql/seed.sql/migrations
#               cargados automáticamente en el primer arranque
#   - backend   API REST (Node.js/Express) en el puerto 4000
#   - frontend  React compilado, servido por Nginx en el puerto 5173
#
# Requiere un archivo .env en la raíz del proyecto (copia .env.docker.example)
# ============================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - '5432:5432'
    volumes:
      - sisvac_pgdata:/var/lib/postgresql/data
      # Los scripts en /docker-entrypoint-initdb.d se ejecutan en orden
      # alfabético SOLO la primera vez que se crea el volumen de datos.
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./backend/database/migrations/002_agregar_canal_sms.sql:/docker-entrypoint-initdb.d/03_migration_sms.sql:ro
      - ./backend/database/migrations/003_agregar_telegram_chat_id.sql:/docker-entrypoint-initdb.d/04_migration_telegram.sql:ro
      - ./backend/database/migrations/004_catalogo_departamentos_municipios.sql:/docker-entrypoint-initdb.d/05_migration_catalogo.sql:ro
      - ./backend/database/migrations/005_centros_salud.sql:/docker-entrypoint-initdb.d/06_migration_centros.sql:ro
      - ./backend/database/migrations/006_ampliar_centros_salud.sql:/docker-entrypoint-initdb.d/07_migration_centros_ampliado.sql:ro
      - ./backend/database/migrations/007_rol_consulta_limitada.sql:/docker-entrypoint-initdb.d/08_migration_rol_consulta.sql:ro
      - ./backend/database/migrations/008_cifrado_datos_padres.sql:/docker-entrypoint-initdb.d/09_migration_cifrado.sql:ro
      - ./backend/database/migrations/009_dpi_hash_unico.sql:/docker-entrypoint-initdb.d/10_migration_dpi_hash.sql:ro
      - ./backend/database/migrations/010_campanias_envio.sql:/docker-entrypoint-initdb.d/11_migration_campanias.sql:ro
      - ./backend/database/migrations/011_enfermeria_y_avisos.sql:/docker-entrypoint-initdb.d/12_migration_enfermeria_avisos.sql:ro
      - ./backend/database/migrations/012_comunidades_linguisticas.sql:/docker-entrypoint-initdb.d/13_migration_comunidades_linguisticas.sql:ro
      - ./backend/database/migrations/013_linguisticas_por_departamento.sql:/docker-entrypoint-initdb.d/14_migration_linguisticas_departamento.sql:ro
      - ./backend/database/migrations/014_carnet_qr.sql:/docker-entrypoint-initdb.d/15_migration_carnet_qr.sql:ro
      - ./backend/database/migrations/015_bloqueo_login_padres.sql:/docker-entrypoint-initdb.d/16_migration_bloqueo_login_padres.sql:ro
      - ./backend/database/migrations/016_esquema_vacunacion.sql:/docker-entrypoint-initdb.d/17_migration_esquema_vacunacion.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PGUSER} -d ${PGDATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  sisvac_pgdata:
